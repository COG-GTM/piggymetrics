server:
  servlet:
    context-path: /notifications
  port: 8000

remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:5000/uaa
          jwk-set-uri: http://auth-service:5000/uaa/oauth2/jwks
      client:
        registration:
          notification-service:
            provider: uaa
            client-id: notification-service
            client-secret: ${NOTIFICATION_SERVICE_PASSWORD}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: server
        provider:
          uaa:
            token-uri: http://auth-service:5000/uaa/oauth2/token
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    mongodb:
      host: notification-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017
  mail:
    host: smtp.gmail.com
    port: 465
    username: dev-user
    password: dev-password
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
