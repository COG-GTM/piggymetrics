spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-service:5000/uaa
          jwk-set-uri: http://auth-service:5000/uaa/oauth2/jwks
      client:
        registration:
          account-service:
            provider: auth-service
            client-id: account-service
            client-secret: ${ACCOUNT_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
        provider:
          auth-service:
            token-uri: http://auth-service:5000/uaa/oauth2/token
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    mongodb:
      host: account-mongodb
      username: user
      password: ${MONGODB_PASSWORD}
      database: piggymetrics
      port: 27017

server:
  servlet:
    context-path: /accounts
  port: 6000

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
