spring:
  data:
    mongodb:
      database: piggymetrics
  cloud:
    config:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      client:
        registration:
          account-service:
            client-id: account-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: server
        provider:
          account-service:
            token-uri: http://localhost:5000/uaa/oauth/token
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0
