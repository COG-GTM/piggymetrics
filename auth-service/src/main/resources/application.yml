server:
  servlet:
    context-path: /uaa
  port: 5000

spring:
  application:
    name: auth-service
  config:
    import: configserver:http://config:8888
  cloud:
    config:
      fail-fast: true
      password: ${CONFIG_SERVICE_PASSWORD}
      username: user
  data:
    mongodb:
      host: auth-mongodb
      port: 27017
      database: piggymetrics
